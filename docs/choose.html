<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get Marvin — choose how</title>
    <meta
      name="description"
      content="Support Marvin with $5, or download free if you cannot afford it."
    />
    <link rel="icon" type="image/png" href="brand-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js" defer></script>
    <script src="site.js" defer></script>
  </head>
  <body>
    <!--
      THESIS: Two enamel choices, equal weight — pay or free, no soft cards.
      OWN-WORLD: Signal Board · tan / ink / bright green · Archivo · square edges.
      STORY: Visitor picks how to get Marvin; $5 or cannot afford.
      FIRST VIEWPORT: Brand · directive headline · lede · two choice plates · note.
      FORM: Signal Board · seed 77a4b2bd · model-pick.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="page">
      <p class="back-link"><a href="index.html">← Marvin</a></p>

      <p class="brand">
        <a href="index.html">
          <img class="brand-mark" src="brand-logo.png" alt="" width="48" height="48" />
          <span class="brand-name">Marvin</span>
        </a>
      </p>

      <h1 class="headline">How do you get Marvin?</h1>

      <p class="lede">
        Five dollars keeps the lights on. If that is not possible right now,
        you can still download.
      </p>

      <div class="signal-bar" aria-hidden="true"></div>

      <div class="choice-grid">
        <a
          class="btn btn-primary choice"
          id="buy-link"
          href="#"
          data-role="payment"
        >
          <span class="choice-label">Buy for $5</span>
          <span class="choice-hint">Pay once · then download</span>
        </a>
        <a class="btn btn-secondary choice" href="confirm.html">
          <span class="choice-label">I can't afford $5</span>
          <span class="choice-hint">Continue without paying</span>
        </a>
      </div>

      <p class="cta-note">Secure checkout via Stripe</p>
    </main>
  </body>
</html>
